<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UG SaaS Offline POS</title><link rel="stylesheet" href="./style.css"></head><body><main><h1>UG SaaS Offline POS</h1><p>Unlock a previously enrolled device. Cash drafts remain provisional until online stock approval. Catalog expires after 24 hours.</p><form id="unlock"><label>Workspace<select id="workspace" required></select></label><label>Device passphrase<input id="passphrase" type="password" minlength="16" required></label><button>Unlock</button></form><p id="message" role="status"></p><section id="terminal" hidden><p id="snapshot"></p><form id="sale"><label>Product bundle<select name="bundleId" id="bundle" required></select></label><label>Pieces<input name="quantity" type="number" min="1" step="1" required></label><label>Unit price INR<input name="unitPrice" type="number" min="0" step="0.01" required></label><label>Discount INR<input name="discount" type="number" min="0" step="0.01" value="0" required></label><label>GST %<select name="taxPercent"><option>0</option><option>5</option><option>12</option><option>18</option><option>28</option></select></label><label>Tax type<select name="taxType"><option>NO_TAX</option><option>CGST_SGST</option><option>IGST</option></select></label><button>Save cash draft</button></form><button id="lock">Lock terminal</button><div id="receipt" hidden></div><button id="print" hidden>Print provisional receipt</button><h2>Pending drafts</h2><ul id="drafts"></ul><p>Reconnect, open your company Shop department and sign in as the same user to sync. Do not repeat a sale with a new reference.</p></section></main><script type="module" src="./app.js"></script></body></html>
