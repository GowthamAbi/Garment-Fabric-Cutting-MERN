[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/landing.html"
  status = 200

[[redirects]]
  from = "/try-demo"
  to = "/demo.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
