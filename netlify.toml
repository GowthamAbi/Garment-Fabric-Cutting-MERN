[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/landing.html"
  status = 200

[[redirects]]
  from = "/try-demo"
  to = "/demo.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/offline-pos"
  to = "/offline-pos/index.html"
  status = 200

[[redirects]]
  from = "/offline-pos/"
  to = "/offline-pos/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/offline-pos/*"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; worker-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
