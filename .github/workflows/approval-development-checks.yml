name: Approval Development Checks
on:
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - ".github/workflows/approval-development-checks.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install server dependencies
        run: npm install --prefix server --no-audit --no-fund
      - name: Run server tests
        run: npm test --prefix server
      - name: Check approval modules syntax
        run: |
          node --check server/src/routes/departmentApprovalRequests.routes.js
          node --check server/src/routes/approvalGrants.routes.js
          node --check server/src/services/departmentApprovalPolicy.js
          node --check server/src/services/synchronizeApprovalAudit.js
      - name: Install client dependencies
        run: npm install --prefix client --no-audit --no-fund
      - name: Build client
        run: npm run build --prefix client
